<!-- 1(a)-1：电路交换 -->
<template data-key="1a-circuit" data-question="1a" data-owner="Lin Fengyan" data-source="Homework 1 and group consensus">
<div class="original-text" data-original-question="1a">
<p class="source-major-heading">Problem 1. Circuit, Packet, and Message Switching (30 points)</p>
<p class="source-heading">(a) Circuit switching versus packet switching [6 points]</p>
<div class="question-copy">
<p class="source-context">A 10 Mbps bottleneck link serves users who each require 2 Mbps while active. Circuit switching reserves 2 Mbps for every admitted user throughout the session.</p>
<p class="source-question">Determine the maximum number of users that can be admitted with circuit switching.</p>
</div></div>
<div class="body-content">
<div class="reading-group">
<h2 class="object-heading"><svg class="obj-icon" viewBox="0 0 64 64" role="img" aria-label="user"><circle cx="32" cy="16" r="10"/><path d="M12 56v-7c0-13 9-20 20-20s20 7 20 20v7"/></svg><span>Five dedicated reservations fill the link</span></h2>
<div class="circuit-users">
<div class="user-lane"><svg class="obj-icon" viewBox="0 0 64 64"><circle cx="32" cy="16" r="10"/><path d="M12 56v-7c0-13 9-20 20-20s20 7 20 20v7"/></svg><b>U1</b><span class="dedicated-line">2 Mbps reserved</span></div>
<div class="user-lane"><svg class="obj-icon" viewBox="0 0 64 64"><circle cx="32" cy="16" r="10"/><path d="M12 56v-7c0-13 9-20 20-20s20 7 20 20v7"/></svg><b>U2</b><span class="dedicated-line">2 Mbps reserved</span></div>
<div class="user-lane"><svg class="obj-icon" viewBox="0 0 64 64"><circle cx="32" cy="16" r="10"/><path d="M12 56v-7c0-13 9-20 20-20s20 7 20 20v7"/></svg><b>U3</b><span class="dedicated-line">2 Mbps reserved</span></div>
<div class="user-lane"><svg class="obj-icon" viewBox="0 0 64 64"><circle cx="32" cy="16" r="10"/><path d="M12 56v-7c0-13 9-20 20-20s20 7 20 20v7"/></svg><b>U4</b><span class="dedicated-line">2 Mbps reserved</span></div>
<div class="user-lane"><svg class="obj-icon" viewBox="0 0 64 64"><circle cx="32" cy="16" r="10"/><path d="M12 56v-7c0-13 9-20 20-20s20 7 20 20v7"/></svg><b>U5</b><span class="dedicated-line">2 Mbps reserved</span></div>
</div></div>
<div class="reading-group"><div class="eq">10 Mbps / (2 Mbps per user) = <strong>5 admitted users</strong></div><p class="explain">The reservation remains assigned even when its user is inactive.</p></div>
<div class="reading-group"><p class="answer-line">Circuit switching admits at most 5 users.</p></div>
</div>
</template>

<!-- 1(a)-2：分组交换 -->
<template data-key="1a-packet" data-question="1a" data-owner="Lin Fengyan" data-source="Homework 1 and group consensus">
<div class="original-text" data-original-question="1a">
<p class="source-major-heading">Problem 1. Circuit, Packet, and Message Switching (30 points)</p>
<p class="source-heading">(a) Packet switching and statistical sharing</p>
<div class="question-copy">
<p class="source-context">With packet switching, active users share the 10 Mbps link and no bandwidth is reserved for an individual user. The model is bufferless, so offered traffic above 10 Mbps is lost.</p>
<p class="source-question">Find the largest simultaneous active-user count without overload, explain why more bursty users can be admitted, and state one drawback.</p>
</div></div>
<div class="body-content">
<div class="reading-group">
<div class="sender-and-counts">
<div class="sender-object"><img class="teaching-scene" src="asset/teaching-sender-v2.png" alt="A user sends data packets from a laptop"><p class="scene-caption">Only active users send packets</p></div>
<div class="active-users">
<div class="user-packet"><b>U1</b><span class="packet-token">2 Mbps</span></div><div class="user-packet"><b>U2</b><span class="packet-token">2 Mbps</span></div>
<div class="user-packet"><b>U3</b><span class="packet-token">2 Mbps</span></div><div class="user-packet"><b>U4</b><span class="packet-token">2 Mbps</span></div>
<div class="user-packet"><b>U5</b><span class="packet-token">2 Mbps</span></div><div class="user-packet overload"><b>U6</b><span class="packet-token violet">excess</span></div>
</div></div>
<div class="shared-link"><svg class="obj-icon" viewBox="0 0 64 64" role="img" aria-label="link"><path d="M6 32h52M6 23v18M58 23v18M20 25l7 7-7 7M37 25l7 7-7 7"/></svg><b>One shared 10 Mbps link</b></div>
</div>
<div class="reading-group"><div class="eq">5 × 2 = 10 Mbps; 6 × 2 = 12 Mbps</div><p class="explain">Idle users reserve nothing, so the network may admit more than five bursty users. At most five may be active together without overload.</p></div>
<div class="reading-group"><p class="answer-line">Its drawback is that simultaneous bursts can overload the link and cause packet loss in this bufferless model; unlike circuit switching, per-user bandwidth and service are not guaranteed</p></div>
</div>
</template>

<!-- 1(b)-1：随机模型与平均速率 -->
<template data-key="1b-model" data-question="1b" data-owner="Lin Fengyan" data-source="Homework 1 and group consensus">
<div class="original-text" data-original-question="1b">
<p class="source-major-heading">Problem 1. Circuit, Packet, and Message Switching (30 points)</p>
<p class="source-heading">(b) Packet switching: offered load model</p>
<div class="question-copy"><p class="source-question">Assume N = 10 admitted users. Each user is independently active with probability 0.20 and sends at 2 Mbps while active. Compute the mean aggregate offered rate and identify the overload event on a 10 Mbps link.</p></div>
</div>
<div class="body-content">
<div class="reading-group">
<div class="causal-flow">
<div class="object"><svg class="obj-icon" viewBox="0 0 64 64"><circle cx="32" cy="16" r="10"/><path d="M12 56v-7c0-13 9-20 20-20s20 7 20 20v7"/></svg><strong>10 admitted users</strong><span>active independently with p = 0.20</span></div>
<div class="relation"><span>count active users</span><b aria-hidden="true">→</b></div>
<div class="object"><strong>X active users</strong><span>X ~ Binomial(10, 0.20)</span></div>
<div class="relation"><span>compare demand</span><b aria-hidden="true">→</b></div>
<div class="object violet"><strong>10 Mbps link</strong><span>overload when 2X &gt; 10, so X ≥ 6</span></div>
</div>
<div class="eq">Mean offered rate = 10 × 0.20 × 2 Mbps = <strong>4 Mbps</strong></div>
</div>
<div class="reading-group">
<figure class="distribution"><div class="prob-bars">
<div class="prob-col" style="--probability:.107374"><span class="prob-value">10.7%</span><i></i><b>0</b></div><div class="prob-col" style="--probability:.268435"><span class="prob-value">26.8%</span><i></i><b>1</b></div><div class="prob-col" style="--probability:.301990"><span class="prob-value">30.2%</span><i></i><b>2</b></div><div class="prob-col" style="--probability:.201327"><span class="prob-value">20.1%</span><i></i><b>3</b></div><div class="prob-col" style="--probability:.088080"><span class="prob-value">8.8%</span><i></i><b>4</b></div><div class="prob-col" style="--probability:.026424"><span class="prob-value">2.6%</span><i></i><b>5</b></div><div class="prob-col tail" style="--probability:.005505"><span class="prob-value">0.551%</span><i></i><b>6</b></div><div class="prob-col tail" style="--probability:.000786"><span class="prob-value">0.079%</span><i></i><b>7</b></div><div class="prob-col tail" style="--probability:.000074"><span class="prob-value">0.007%</span><i></i><b>8</b></div><div class="prob-col tail" style="--probability:.000004"><span class="prob-value">&lt;0.001%</span><i></i><b>9</b></div><div class="prob-col tail" style="--probability:.0000001"><span class="prob-value">&lt;0.001%</span><i></i><b>10</b></div>
</div><figcaption>Distribution of active users. Violet bars are overload states.</figcaption></figure>
</div>
<div class="reading-group"><p class="answer-line">The 4 Mbps mean does not capture the probability of six or more simultaneous senders.</p></div>
</div>
</template>

<!-- 1(b)-2：精确过载概率与准入 -->
<template data-key="1b-admission" data-question="1b" data-owner="Lin Fengyan" data-source="Homework 1 and group consensus">
<div class="original-text" data-original-question="1b">
<p class="source-major-heading">Problem 1. Circuit, Packet, and Message Switching (30 points)</p><p class="source-heading">(b) Exact overload probability and admission</p>
<div class="question-copy"><p class="source-question">The overload probability must be at most 1%. Determine whether an 11th user can be admitted on the same 10 Mbps link and find the largest admissible N.</p></div>
</div>
<div class="body-content">
<div class="reading-group"><h2>N = 10</h2><div class="math"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>P</mi><mo>(</mo><mi>X</mi><mo>≥</mo><mn>6</mn><mo>)</mo><mo>=</mo><munderover><mo>∑</mo><mrow><mi>k</mi><mo>=</mo><mn>6</mn></mrow><mn>10</mn></munderover><mrow><mo>(</mo><mfrac linethickness="0"><mn>10</mn><mi>k</mi></mfrac><mo>)</mo></mrow><msup><mn>0.2</mn><mi>k</mi></msup><msup><mn>0.8</mn><mrow><mn>10</mn><mo>−</mo><mi>k</mi></mrow></msup><mo>=</mo><mn>0.0063693824</mn><mo>≈</mo><mn>0.6369</mn><mo>%</mo></mrow></math></div></div>
<div class="reading-group"><h2>N = 11</h2><div class="math"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>P</mi><mo>(</mo><mi>X</mi><mo>≥</mo><mn>6</mn><mo>)</mo><mo>=</mo><munderover><mo>∑</mo><mrow><mi>k</mi><mo>=</mo><mn>6</mn></mrow><mn>11</mn></munderover><mrow><mo>(</mo><mfrac linethickness="0"><mn>11</mn><mi>k</mi></mfrac><mo>)</mo></mrow><msup><mn>0.2</mn><mi>k</mi></msup><msup><mn>0.8</mn><mrow><mn>11</mn><mo>−</mo><mi>k</mi></mrow></msup><mo>=</mo><mn>0.01165420544</mn><mo>≈</mo><mn>1.1654</mn><mo>%</mo></mrow></math></div></div>
<div class="reading-group"><table class="admission-table"><thead><tr><th>Users N</th><th>Overload on 10 Mbps</th><th>1% requirement</th></tr></thead><tbody><tr><td>10</td><td>0.6369%</td><td>Pass</td></tr><tr><td>11</td><td>1.1654%</td><td>Fail</td></tr></tbody></table></div>
<div class="reading-group"><p class="answer-line">The 11th user fails the requirement. The largest admissible N is 10.</p></div>
</div>
</template>

<!-- 1(b)-3：容量提升 -->
<template data-key="1b-capacity" data-question="1b" data-owner="Lin Fengyan" data-source="Homework 1 and group consensus">
<div class="original-text" data-original-question="1b">
<p class="source-major-heading">Problem 1. Circuit, Packet, and Message Switching (30 points)</p><p class="source-heading">(b) Minimum capacity for 11 users</p>
<div class="question-copy"><p class="source-question">If all 11 users must be supported, find the minimum link capacity that satisfies the 1% overload requirement.</p></div>
</div>
<div class="body-content">
<div class="reading-group"><div class="capacity-working">
<div><div class="threshold-lanes"><div><b>Below 12 Mbps</b><span>Six active users still overload the link.</span></div><div><b>At 12 Mbps</b><span>Six active users fit, so overload starts at seven.</span></div></div><p>The threshold changes only after another full 2 Mbps user demand fits.</p></div>
<div><div class="eq">11 users, 12 Mbps: overload when X ≥ 7</div><div class="math"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>P</mi><mo>(</mo><mi>X</mi><mo>≥</mo><mn>7</mn><mo>)</mo><mo>=</mo><munderover><mo>∑</mo><mrow><mi>k</mi><mo>=</mo><mn>7</mn></mrow><mn>11</mn></munderover><mrow><mo>(</mo><mfrac linethickness="0"><mn>11</mn><mi>k</mi></mfrac><mo>)</mo></mrow><msup><mn>0.2</mn><mi>k</mi></msup><msup><mn>0.8</mn><mrow><mn>11</mn><mo>−</mo><mi>k</mi></mrow></msup><mo>=</mo><mn>0.0019653632</mn><mo>≈</mo><mn>0.1965</mn><mo>%</mo></mrow></math></div><p>0.1965% is below the 1% limit.</p></div>
</div></div>
<div class="reading-group"><p class="answer-line">Minimum capacity for 11 users = 12 Mbps.</p></div>
</div>
</template>

<!-- 1(c)-1：路径与转发单位 -->
<template data-key="1c-model" data-question="1c" data-owner="Lin Fengyan" data-source="Homework 1 and group consensus">
<div class="original-text" data-original-question="1c">
<p class="source-major-heading">Problem 1. Circuit, Packet, and Message Switching (30 points)</p><p class="source-heading">(c) Message switching versus packet switching [12 points]</p>
<div class="question-copy"><p class="source-context">A sends a 6 Mbit application payload to B through store-and-forward routers R1 and R2. Each router processes a received unit for 1 ms, and every link has a 10 ms propagation delay.</p><p class="source-question">Compare one 6.01 Mbit message with six 1.01 Mbit packets on the 10, 5, and 10 Mbps links.</p></div>
</div>
<div class="body-content">
<div class="reading-group"><img class="store-forward-path" src="asset/store-and-forward-path.png" alt="Store-and-forward path from A through R1 and R2 to B"></div>
<div class="reading-group"><div class="teaching-split">
<section><h2>Message switching</h2><div class="message-token">6 Mbit payload + 10 Kbit header = 6.01 Mbit</div><p class="explain">A router waits for the complete message before forwarding it.</p></section>
<section><h2>Packet switching</h2><div class="packet-sequence"><span class="packet-token violet">P1</span><span class="packet-token">P2</span><span class="packet-token">P3</span><span class="packet-token">P4</span><span class="packet-token">P5</span><span class="packet-token">P6</span></div><p class="explain">Each packet carries a 1 Mbit payload and its own 10 Kbit header.</p></section>
</div></div>
<div class="reading-group"><p class="answer-line">The 5 Mbps middle link is the bottleneck for both approaches.</p></div>
</div>
</template>

<!-- 1(c)-2：消息时延与流水线 -->
<template data-key="1c-pipeline" data-question="1c" data-owner="Lin Fengyan" data-source="Homework 1 and group consensus">
<div class="original-text" data-original-question="1c">
<p class="source-major-heading">Problem 1. Circuit, Packet, and Message Switching (30 points)</p><p class="source-heading">(c) Completion time and pipelining</p>
<div class="question-copy"><p class="source-question">Compute the message-switching completion time and explain why packet switching can finish earlier even though it sends more header bits.</p></div>
</div>
<div class="body-content">
<div class="reading-group"><div class="teaching-split">
<section><h2>One complete message</h2><p class="explain">The three transmissions cannot overlap because each router must receive all 6.01 Mbit first.</p><div class="eq">T = 0.601 + 1.202 + 0.601 s<br>+ 3 × 0.010 s + 2 × 0.001 s<br>= <strong>2.436 s</strong></div></section>
<section><h2>Six packets in a pipeline</h2><p class="explain">Per-packet transmission times on the three links:</p><div class="eq"><strong>101 ms / 202 ms / 101 ms</strong></div><p class="explain">Once P1 reaches R1, R1 forwards it while A sends later packets. Work overlaps across links.</p></section>
</div></div>
<div class="reading-group"><p class="answer-line">Pipelining outweighs the repeated headers, but smaller packets add header and per-packet processing overhead.</p></div>
</div>
</template>

<!-- 1(c)-3：分组时间线 -->
<template data-key="1c-time" data-question="1c" data-owner="Lin Fengyan" data-source="Homework 1 and group consensus">
<div class="original-text" data-original-question="1c">
<p class="source-major-heading">Problem 1. Circuit, Packet, and Message Switching (30 points)</p><p class="source-heading">(c) Packet timing on the bottleneck path</p>
<div class="question-copy"><p class="source-question">Show the timing of P1, P2, and P6, then compute when the last packet reaches B.</p></div>
</div>
<div class="body-content">
<div class="reading-group"><div class="packet-timeline">
<div class="time-ruler"><span style="left:0%">0</span><span style="left:25%">400</span><span style="left:50%">800</span><span style="left:75%">1200</span><span style="left:100%">1600</span><small>ms</small></div>
<div class="time-lane"><b>A → R1</b><div class="time-track"><span class="time-packet p1" style="left:0%;width:6.3125%">P1</span><span class="time-packet p2" style="left:6.3125%;width:6.3125%">P2</span><span class="time-packet p3" style="left:12.625%;width:6.3125%">P3</span><span class="time-packet p4" style="left:18.9375%;width:6.3125%">P4</span><span class="time-packet p5" style="left:25.25%;width:6.3125%">P5</span><span class="time-packet p6" style="left:31.5625%;width:6.3125%">P6</span></div></div>
<div class="time-lane"><b>R1 → R2</b><div class="time-track"><span class="time-packet p1" style="left:7%;width:12.625%">P1</span><span class="time-packet p2" style="left:19.625%;width:12.625%">P2</span><span class="time-packet p3" style="left:32.25%;width:12.625%">P3</span><span class="time-packet p4" style="left:44.875%;width:12.625%">P4</span><span class="time-packet p5" style="left:57.5%;width:12.625%">P5</span><span class="time-packet p6" style="left:70.125%;width:12.625%">P6</span></div></div>
<div class="time-lane"><b>R2 → B</b><div class="time-track"><span class="time-packet p1" style="left:20.3125%;width:6.3125%">P1</span><span class="time-packet p2" style="left:32.9375%;width:6.3125%">P2</span><span class="time-packet p3" style="left:45.5625%;width:6.3125%">P3</span><span class="time-packet p4" style="left:58.1875%;width:6.3125%">P4</span><span class="time-packet p5" style="left:70.8125%;width:6.3125%">P5</span><span class="time-packet p6" style="left:83.4375%;width:6.3125%">P6</span></div></div>
</div></div>
<div class="reading-group"><table class="timing"><thead><tr><th>Packet</th><th>A sends</th><th>Ready R1</th><th>R1 sends</th><th>Ready R2</th><th>R2 sends</th><th>B receives</th></tr></thead><tbody><tr><td>P1</td><td>0–101</td><td>112</td><td>112–314</td><td>325</td><td>325–426</td><td>436</td></tr><tr><td>P2</td><td>101–202</td><td>213</td><td>314–516</td><td>527</td><td>527–628</td><td>638</td></tr><tr><td>P6</td><td>505–606</td><td>617</td><td>1122–1324</td><td>1335</td><td>1335–1436</td><td>1446</td></tr></tbody></table></div>
<div class="reading-group"><p class="answer-line">Last packet: 436 ms + 5 × 202 ms = 1446 ms = 1.446 s.</p></div>
</div>
</template>
