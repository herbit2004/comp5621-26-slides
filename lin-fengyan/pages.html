<template data-key="1a" data-question="1a" data-owner="Lin Fengyan" data-source="Homework 1 and group consensus">
<div class="original-text" data-original-question="1a">
<p class="source-major-heading">Problem 1. Circuit, Packet, and Message Switching (30 points)</p>
<p class="source-heading">(a) Circuit switching versus packet switching [6 points]</p>
<div class="question-copy">
<p class="source-context">A campus gateway has a 10 Mbps bottleneck link shared by several users. Each user alternates between active and inactive periods. An active user sends at 2 Mbps; an inactive user sends nothing. At any given instant, each user is independently active with probability p = 0.20. With circuit switching, 2 Mbps is reserved for every admitted user throughout the session. With packet switching, users share the link and no fixed bandwidth is reserved for an individual user. In parts (a) and (b), use a bufferless model: overload occurs when the instantaneous offered rate is greater than the link capacity.</p>
<p class="source-question">Determine (i) the maximum number of users that can be admitted with circuit switching and (ii) the maximum number of users that can be active at the same time with packet switching without overload. Explain why packet switching can support more bursty users than circuit switching. State one drawback of this statistical sharing.</p></div></div>
<div class="body-content">
<div class="reading-group" data-step="1">
<div class="teaching-split">
<section>
<h2 class="object-heading">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="user"><circle cx="32" cy="16" r="10"/><path d="M12 56v-7c0-13 9-20 20-20s20 7 20 20v7"/></svg><span>Circuit switching</span></h2>
<div class="circuit-users">
<div class="user-lane">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="user"><circle cx="32" cy="16" r="10"/><path d="M12 56v-7c0-13 9-20 20-20s20 7 20 20v7"/></svg><b>U1</b><span class="dedicated-line">2 Mbps reserved</span></div>
<div class="user-lane">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="user"><circle cx="32" cy="16" r="10"/><path d="M12 56v-7c0-13 9-20 20-20s20 7 20 20v7"/></svg><b>U2</b><span class="dedicated-line">2 Mbps reserved</span></div>
<div class="user-lane">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="user"><circle cx="32" cy="16" r="10"/><path d="M12 56v-7c0-13 9-20 20-20s20 7 20 20v7"/></svg><b>U3</b><span class="dedicated-line">2 Mbps reserved</span></div>
<div class="user-lane">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="user"><circle cx="32" cy="16" r="10"/><path d="M12 56v-7c0-13 9-20 20-20s20 7 20 20v7"/></svg><b>U4</b><span class="dedicated-line">2 Mbps reserved</span></div>
<div class="user-lane">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="user"><circle cx="32" cy="16" r="10"/><path d="M12 56v-7c0-13 9-20 20-20s20 7 20 20v7"/></svg><b>U5</b><span class="dedicated-line">2 Mbps reserved</span></div></div>
<div class="eq">10 Mbps / (2 Mbps/user) = <strong>5 admitted users</strong></div>
<p class="explain">A reservation belongs to its user for the entire session. Silence does not release it.</p></section>
<section>
<h2 class="object-heading">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="packet"><rect x="8" y="16" width="48" height="32" rx="3"/><path d="M20 16v32M29 26h17M29 36h17"/></svg><span>Packet switching</span></h2>
<div class="sender-and-counts">
<div class="sender-object">
<img class="teaching-scene" src="asset/teaching-sender-v2.png" alt="A user sends data packets from a laptop">
<p class="scene-caption">Each active user<br>sends packets</p></div>
<div class="active-users">
<div class="user-packet ">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="user"><circle cx="32" cy="16" r="10"/><path d="M12 56v-7c0-13 9-20 20-20s20 7 20 20v7"/></svg><b>U1</b><span class="packet-token ">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="packet"><rect x="8" y="16" width="48" height="32" rx="3"/><path d="M20 16v32M29 26h17M29 36h17"/></svg><b>2 Mbps</b></span></div>
<div class="user-packet ">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="user"><circle cx="32" cy="16" r="10"/><path d="M12 56v-7c0-13 9-20 20-20s20 7 20 20v7"/></svg><b>U2</b><span class="packet-token ">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="packet"><rect x="8" y="16" width="48" height="32" rx="3"/><path d="M20 16v32M29 26h17M29 36h17"/></svg><b>2 Mbps</b></span></div>
<div class="user-packet ">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="user"><circle cx="32" cy="16" r="10"/><path d="M12 56v-7c0-13 9-20 20-20s20 7 20 20v7"/></svg><b>U3</b><span class="packet-token ">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="packet"><rect x="8" y="16" width="48" height="32" rx="3"/><path d="M20 16v32M29 26h17M29 36h17"/></svg><b>2 Mbps</b></span></div>
<div class="user-packet ">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="user"><circle cx="32" cy="16" r="10"/><path d="M12 56v-7c0-13 9-20 20-20s20 7 20 20v7"/></svg><b>U4</b><span class="packet-token ">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="packet"><rect x="8" y="16" width="48" height="32" rx="3"/><path d="M20 16v32M29 26h17M29 36h17"/></svg><b>2 Mbps</b></span></div>
<div class="user-packet ">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="user"><circle cx="32" cy="16" r="10"/><path d="M12 56v-7c0-13 9-20 20-20s20 7 20 20v7"/></svg><b>U5</b><span class="packet-token ">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="packet"><rect x="8" y="16" width="48" height="32" rx="3"/><path d="M20 16v32M29 26h17M29 36h17"/></svg><b>2 Mbps</b></span></div>
<div class="user-packet overload">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="user"><circle cx="32" cy="16" r="10"/><path d="M12 56v-7c0-13 9-20 20-20s20 7 20 20v7"/></svg><b>U6</b><span class="packet-token violet">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="packet"><rect x="8" y="16" width="48" height="32" rx="3"/><path d="M20 16v32M29 26h17M29 36h17"/></svg><b>excess</b></span></div></div></div>
<div class="shared-link">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="link"><path d="M6 32h52M6 23v18M58 23v18M20 25l7 7-7 7M37 25l7 7-7 7"/></svg><b>One shared 10 Mbps link</b><span>Five active users fill it; a sixth offers excess traffic.</span></div>
<div class="eq">5 × 2 = 10 Mbps; 6 × 2 = 12 Mbps</div>
<p class="explain">Idle users send no packets and reserve no bandwidth. More than five users can be admitted. At most five may be active simultaneously without overload; six or more cause excess traffic.</p></section></div></div>
<div class="reading-group" data-step="2">
<p class="answer-line">5 admitted circuit users; 5 simultaneously active packet users. In this bufferless model, simultaneous overload loses excess traffic and offers no dedicated per-user guarantee.</p></div></div>

<!-- 页面：1b-mean；正文保持英文，原题位于页面顶部。 -->
<template data-key="1b-mean" data-question="1b" data-owner="Lin Fengyan" data-source="Homework 1 and group consensus">
<div class="original-text" data-original-question="1b">
<p class="source-major-heading">Problem 1. Circuit, Packet, and Message Switching (30 points)</p>
<p class="source-heading">(b) Packet switching: user admission and link capacity [12 points]</p>
<div class="question-copy">
<p class="source-question">Assume N = 10 users are admitted with packet switching. Compute the mean aggregate offered rate and the exact overload probability. The required overload probability is at most 1%. Determine whether an 11th user can be admitted on the same 10 Mbps link, and find the largest admissible N. If all 11 users must be supported, find the minimum link capacity that satisfies the 1% requirement. Explain why the mean offered rate alone is not sufficient for this decision.</p></div></div>
<div class="body-content">
<div class="reading-group" data-step="1">
<div class="causal-flow">
<div class="object ">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="user"><circle cx="32" cy="16" r="10"/><path d="M12 56v-7c0-13 9-20 20-20s20 7 20 20v7"/></svg><strong>N admitted users</strong><span>Each independently active with probability 0.20</span></div>
<div class="relation"><span>count active users</span><b aria-hidden="true">→</b></div>
<div class="object ">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="user"><circle cx="32" cy="16" r="10"/><path d="M12 56v-7c0-13 9-20 20-20s20 7 20 20v7"/></svg><strong>X active users</strong><span>Each sends packets at 2 Mbps</span></div>
<div class="relation"><span>compare demand with capacity</span><b aria-hidden="true">→</b></div>
<div class="object violet">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="link"><path d="M6 32h52M6 23v18M58 23v18M20 25l7 7-7 7M37 25l7 7-7 7"/></svg><strong>10 Mbps capacity</strong><span>Overload: 2X > 10, so X ≥ 6</span></div></div>
<div class="eq">For N = 10: mean offered rate = 10 × 0.20 × 2 Mbps = <strong>4 Mbps</strong></div></div>
<div class="reading-group" data-step="2">
<figure class="distribution">
<div class="prob-bars">
<div class="prob-col " data-probability="0.10737418240000006" style="--probability:0.10737418240000006"><span class="prob-value">10.7%</span><i aria-label="P(X=0)=0.10737418240000006"></i><b>0</b></div>
<div class="prob-col " data-probability="0.2684354560000001" style="--probability:0.2684354560000001"><span class="prob-value">26.8%</span><i aria-label="P(X=1)=0.2684354560000001"></i><b>1</b></div>
<div class="prob-col " data-probability="0.3019898880000002" style="--probability:0.3019898880000002"><span class="prob-value">30.2%</span><i aria-label="P(X=2)=0.3019898880000002"></i><b>2</b></div>
<div class="prob-col " data-probability="0.2013265920000001" style="--probability:0.2013265920000001"><span class="prob-value">20.1%</span><i aria-label="P(X=3)=0.2013265920000001"></i><b>3</b></div>
<div class="prob-col " data-probability="0.08808038400000005" style="--probability:0.08808038400000005"><span class="prob-value">8.8%</span><i aria-label="P(X=4)=0.08808038400000005"></i><b>4</b></div>
<div class="prob-col " data-probability="0.02642411520000001" style="--probability:0.02642411520000001"><span class="prob-value">2.6%</span><i aria-label="P(X=5)=0.02642411520000001"></i><b>5</b></div>
<div class="prob-col tail" data-probability="0.005505024000000003" style="--probability:0.005505024000000003"><span class="prob-value">0.551%</span><i aria-label="P(X=6)=0.005505024000000003"></i><b>6</b></div>
<div class="prob-col tail" data-probability="0.0007864320000000004" style="--probability:0.0007864320000000004"><span class="prob-value">0.079%</span><i aria-label="P(X=7)=0.0007864320000000004"></i><b>7</b></div>
<div class="prob-col tail" data-probability="0.00007372800000000005" style="--probability:0.00007372800000000005"><span class="prob-value">0.007%</span><i aria-label="P(X=8)=0.00007372800000000005"></i><b>8</b></div>
<div class="prob-col tail" data-probability="0.000004096000000000002" style="--probability:0.000004096000000000002"><span class="prob-value">&lt;0.001%</span><i aria-label="P(X=9)=0.000004096000000000002"></i><b>9</b></div>
<div class="prob-col tail" data-probability="1.0240000000000006e-7" style="--probability:1.0240000000000006e-7"><span class="prob-value">&lt;0.001%</span><i aria-label="P(X=10)=1.0240000000000006e-7"></i><b>10</b></div></div><figcaption>Number X of active users. Bar heights use exact binomial probabilities; labels are rounded. Highlighted bars overload 10 Mbps.</figcaption></figure></div>
<div class="reading-group" data-step="3">
<div class="math">
<math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>P</mi><mo>(</mo><mi>X</mi><mo>≥</mo><mn>6</mn><mo>)</mo><mo>=</mo><munderover><mo>∑</mo><mrow><mi>k</mi><mo>=</mo><mn>6</mn></mrow><mn>10</mn></munderover><mrow><mo>(</mo><mfrac linethickness="0"><mn>10</mn><mi>k</mi></mfrac><mo>)</mo></mrow><msup><mrow><mo>(</mo><mn>0.2</mn><mo>)</mo></mrow><mi>k</mi></msup><msup><mrow><mo>(</mo><mn>0.8</mn><mo>)</mo></mrow><mrow><mn>10</mn><mo>−</mo><mi>k</mi></mrow></msup><mo>=</mo><mn>0.0063693824</mn><mo>≈</mo><mn>0.6369</mn><mo>%</mo></mrow></math></div>
<p class="explain">X ~ Binomial(N, 0.20). The combination counts which k users are active; 0.2ᵏ × 0.8ᴺ⁻ᵏ gives the probability of that particular active/idle pattern. Add every overloaded case.</p></div>
<div class="reading-group" data-step="4">
<p class="answer-line">The average is below capacity, but admission is tested against the overload probability, not the average.</p></div></div>
</template>
<!-- 页面：1b-admit；正文保持英文，原题位于页面顶部。 -->
<template data-key="1b-admit" data-question="1b" data-owner="Lin Fengyan" data-source="Homework 1 and group consensus">
<div class="original-text" data-original-question="1b">
<p class="source-major-heading">Problem 1. Circuit, Packet, and Message Switching (30 points)</p>
<p class="source-heading">(b) Packet switching: user admission and link capacity [12 points]</p>
<div class="question-copy">
<p class="source-question">Assume N = 10 users are admitted with packet switching. Compute the mean aggregate offered rate and the exact overload probability. The required overload probability is at most 1%. Determine whether an 11th user can be admitted on the same 10 Mbps link, and find the largest admissible N. If all 11 users must be supported, find the minimum link capacity that satisfies the 1% requirement. Explain why the mean offered rate alone is not sufficient for this decision.</p></div></div>
<div class="body-content">
<div class="reading-group admission-calculation" data-step="1">
<table class="admission-table">
<thead>
<tr><th>Users N</th><th>Overload on 10 Mbps</th><th>1% requirement</th></tr></thead>
<tbody>
<tr><td>10</td><td>0.0063693824 ≈ 0.6369%</td><td>Pass</td></tr>
<tr><td>11</td><td>0.01165420544 ≈ 1.1654%</td><td>Fail</td></tr></tbody></table>
<div class="math">
<math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>P</mi><mo>(</mo><mi>X</mi><mo>≥</mo><mn>6</mn><mo>)</mo><mo>=</mo><munderover><mo>∑</mo><mrow><mi>k</mi><mo>=</mo><mn>6</mn></mrow><mn>11</mn></munderover><mrow><mo>(</mo><mfrac linethickness="0"><mn>11</mn><mi>k</mi></mfrac><mo>)</mo></mrow><msup><mrow><mo>(</mo><mn>0.2</mn><mo>)</mo></mrow><mi>k</mi></msup><msup><mrow><mo>(</mo><mn>0.8</mn><mo>)</mo></mrow><mrow><mn>11</mn><mo>−</mo><mi>k</mi></mrow></msup><mo>=</mo><mn>0.01165420544</mn><mo>≈</mo><mn>1.1654</mn><mo>%</mo></mrow></math></div>
<p>At 10 Mbps, six active users overload the link. Adding users cannot reduce this probability, so the largest admissible N is <strong>10</strong>.</p></div>
<div class="reading-group" data-step="2">
<div class="capacity-working">
<div>
<div class="threshold-lanes">
<div><b>Below 12 Mbps</b><span>6 active × 2 Mbps = 12 Mbps: still overloaded.</span></div>
<div><b>At 12 Mbps</b><span>6 active users fit; overload starts at 7.</span></div></div>
<p>The 2 Mbps demand of one additional active user must fit before the overload threshold changes.</p></div>
<div>
<div class="eq">11 users, 12 Mbps: overload when X ≥ 7</div>
<div class="math">
<math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>P</mi><mo>(</mo><mi>X</mi><mo>≥</mo><mn>7</mn><mo>)</mo><mo>=</mo><munderover><mo>∑</mo><mrow><mi>k</mi><mo>=</mo><mn>7</mn></mrow><mn>11</mn></munderover><mrow><mo>(</mo><mfrac linethickness="0"><mn>11</mn><mi>k</mi></mfrac><mo>)</mo></mrow><msup><mrow><mo>(</mo><mn>0.2</mn><mo>)</mo></mrow><mi>k</mi></msup><msup><mrow><mo>(</mo><mn>0.8</mn><mo>)</mo></mrow><mrow><mn>11</mn><mo>−</mo><mi>k</mi></mrow></msup><mo>=</mo><mn>0.0019653632</mn><mo>≈</mo><mn>0.1965</mn><mo>%</mo></mrow></math></div>
<p>Below 1%. Any capacity below 12 Mbps still fails with six active users, making <strong>12 Mbps the minimum</strong>.</p></div></div></div>
<div class="reading-group" data-step="3">
<p class="answer-line">Largest admissible N = 10. Minimum capacity for 11 users = 12 Mbps.</p></div></div>
</template>

<template data-key="1c-model" data-question="1c" data-owner="Lin Fengyan" data-source="Homework 1 and group consensus">
<div class="original-text" data-original-question="1c">
<p class="source-major-heading">Problem 1. Circuit, Packet, and Message Switching (30 points)</p>
<p class="source-heading">(c) Message switching versus packet switching [12 points]</p>
<div class="question-copy">
<p class="source-question">Consider a separate path from A to B through two store-and-forward routers, R1 and R2. There is no background traffic. Each router takes 1 ms to process each received message or packet, and each link has a 10 ms propagation delay. The link rates are shown in the figure. A 6-Mbit application payload is sent from A to B.</p>
<p class="source-question">With message switching, the entire 6-Mbit payload is sent as one message with a single 10-Kbit header. With packet switching, the payload is split into six 1-Mbit packets; each packet has its own 10-Kbit header, and A sends the six packets back-to-back. Assume FIFO service and store-and-forward operation at both routers.</p>
<p class="source-question">Compute the file completion time for message switching and packet switching. For packet switching, show the timing of P1, P2, and P6 and identify the bottleneck link. Explain why packet switching can finish earlier even though it sends more header bits. State one cost of using smaller packets.</p></div></div>
<div class="body-content">
<div class="reading-group" data-step="1">
<div class="causal-flow">
<div class="object ">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="browser"><rect x="6" y="9" width="52" height="42" rx="4"/><path d="M6 21h52M15 15h1m7 0h1m7 0h1M23 57h18"/></svg><strong>A</strong><span>Source</span></div>
<div class="relation"><span>10 Mbps; 10 ms</span><b aria-hidden="true">→</b></div>
<div class="object ">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="router"><rect x="6" y="18" width="52" height="32" rx="5"/><path d="M17 27h12m-4-4 4 4-4 4M47 41H35m4-4-4 4 4 4M13 56h38"/></svg><strong>R1</strong><span>Receive all; process 1 ms</span></div>
<div class="relation"><span>5 Mbps; 10 ms</span><b aria-hidden="true">→</b></div>
<div class="object ">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="router"><rect x="6" y="18" width="52" height="32" rx="5"/><path d="M17 27h12m-4-4 4 4-4 4M47 41H35m4-4-4 4 4 4M13 56h38"/></svg><strong>R2</strong><span>Receive all; process 1 ms</span></div>
<div class="relation"><span>10 Mbps; 10 ms</span><b aria-hidden="true">→</b></div>
<div class="object ">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="browser"><rect x="6" y="9" width="52" height="42" rx="4"/><path d="M6 21h52M15 15h1m7 0h1m7 0h1M23 57h18"/></svg><strong>B</strong><span>Destination</span></div></div></div>
<div class="reading-group" data-step="2">
<div class="teaching-split">
<section>
<h2 class="object-heading">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="packet"><rect x="8" y="16" width="48" height="32" rx="3"/><path d="M20 16v32M29 26h17M29 36h17"/></svg><span>One complete message</span></h2>
<div class="message-token">6 Mbit payload + 10 Kbit header = 6.01 Mbit</div>
<p class="explain">R1 cannot start forwarding until the entire message has arrived and been processed. R2 has the same rule, so the three transmissions do not overlap.</p>
<div class="eq">T = 0.601 + 1.202 + 0.601 s<br>+ 3 × 0.010 s + 2 × 0.001 s<br>= <strong>2.436 s</strong></div></section>
<section>
<h2 class="object-heading">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="packet"><rect x="8" y="16" width="48" height="32" rx="3"/><path d="M20 16v32M29 26h17M29 36h17"/></svg><span>Six independently forwardable packets</span></h2>
<div class="packet-sequence"><span class="packet-token violet">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="packet"><rect x="8" y="16" width="48" height="32" rx="3"/><path d="M20 16v32M29 26h17M29 36h17"/></svg><b>P1</b></span><span class="packet-token ">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="packet"><rect x="8" y="16" width="48" height="32" rx="3"/><path d="M20 16v32M29 26h17M29 36h17"/></svg><b>P2</b></span><span class="packet-token ">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="packet"><rect x="8" y="16" width="48" height="32" rx="3"/><path d="M20 16v32M29 26h17M29 36h17"/></svg><b>P3</b></span><span class="packet-token ">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="packet"><rect x="8" y="16" width="48" height="32" rx="3"/><path d="M20 16v32M29 26h17M29 36h17"/></svg><b>P4</b></span><span class="packet-token ">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="packet"><rect x="8" y="16" width="48" height="32" rx="3"/><path d="M20 16v32M29 26h17M29 36h17"/></svg><b>P5</b></span><span class="packet-token ">
<svg class="obj-icon " viewBox="0 0 64 64" role="img" aria-label="packet"><rect x="8" y="16" width="48" height="32" rx="3"/><path d="M20 16v32M29 26h17M29 36h17"/></svg><b>P6</b></span></div>
<p class="explain">Each packet carries 1 Mbit payload + 10 Kbit header = 1.01 Mbit. Once P1 is complete at R1, R1 can forward it while A sends later packets.</p>
