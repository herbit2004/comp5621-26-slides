:root{--lin-safe-x:8%;--lin-safe-y:7%}

body.show-guides .slide[data-owner="Lin Fengyan"]:not(.title-slide):after{content:'';position:absolute;inset:var(--lin-safe-y) var(--lin-safe-x);border:1px solid rgba(70,90,100,.6);z-index:30;pointer-events:none}
.toolbar #guides[aria-pressed="true"]{font-weight:700;text-decoration:underline;text-underline-offset:4px}

</style>
</head><body>
<!-- 浏览工具不属于幻灯片正文，也不会进入 PDF。 -->
<div class="toolbar"><span>COMP5621 Homework 1</span><button id="previous">上一页</button><button id="next">下一页</button><span id="position">加载中</span><button id="guides" aria-pressed="false">参考线</button><button id="presentation">演示模式</button><button onclick="window.print()">打印 / PDF</button></div>
<p id="loading">正在加载四位组员的本地页面…</p>
<main id="deck"></main>
<!-- 首页正文由这里维护；末页为 Wang He 的 4(c)，框架统一生成。 -->
<!-- 页面：start；正文保持英文，原题位于页面顶部。 -->
<template id="cover" data-key="start" data-question="start" data-owner="Lin Fengyan" data-source="Homework 1 and group consensus">
<h1>Homework 1</h1>
<div class="body-content">
<div class="cover">
<div>
<p class="course">COMP5621 Computer Networks</p>
<h2>Network fundamentals<br>and application protocols</h2>
<p class="cover-sub">Switching, queueing, HTTP and adaptive video</p>
<div class="team">
<div><strong>Lin Fengyan</strong><span>Problem 1</span></div>
<div><strong>Gao Yuanyuan</strong><span>Problem 2</span></div>
<div><strong>Zhang Zhixiang</strong><span>3(a)–3(d)</span></div>
<div><strong>Wang He</strong><span>3(e) and Problem 4</span></div></div></div>
<img src="asset/cover.png" alt="Conceptual laptop routers and server network"></div></div>
</template>

<script>

// 顺序、分工和本地相对目录集中在这里维护。
const members = [
  {folder:'lin-fengyan', name:'Lin Fengyan'},
  {folder:'gao-yuanyuan', name:'Gao Yuanyuan'},
  {folder:'zhang-zhixiang', name:'Zhang Zhixiang'},
  {folder:'wang-he', name:'Wang He'}
];
const groups = [['1',['1a','1b','1c']], ['2',['2a','2b','2c']],
                ['3',['3a','3b','3c','3d','3e']], ['4',['4a','4b','4c']]];
const loaded = new Map();
const escapeHTML = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let completed = false;
// 成员页以消息传回模板，避免 file:// 的读取限制；只接受已登记的本地窗口。
addEventListener('message', event => {
  const member = members.find(m => m.frame?.contentWindow === event.source);
  if (!member || event.data?.type !== 'comp5621-pages' || typeof event.data.html !== 'string') return;
  const doc = new DOMParser().parseFromString(event.data.html, 'text/html');
  const pages = [...doc.querySelectorAll('template')];
  for (const t of pages) {
    // 模板中的图片路径相对成员文件夹；统一样式和字体仍相对首页。
    for (const e of t.content.querySelectorAll('[src],[href]')) {
      for (const attr of ['src','href']) {
        const value = e.getAttribute(attr);
        if (value && !/^(#|[a-z]+:|\/)/i.test(value)) e.setAttribute(attr, member.folder + '/' + value);
      }
    }
    for (const e of t.content.querySelectorAll('[style]')) {
      e.setAttribute('style', e.getAttribute('style').replace(/url\(['"]?(asset\/[^)'"\s]+)['"]?\)/g, (_,p) => `url('${member.folder}/${p}')`));
    }
  }
  loaded.set(member.folder, pages);
  if (loaded.size === members.length && !completed) {completed = true; assemble();}
});
function assemble() {
  const templates = [document.querySelector('#cover'), ...members.flatMap(m => loaded.get(m.folder))];
  const keys = templates.map(t=>t.dataset.key);
  if (new Set(keys).size !== keys.length) throw Error('页面 data-key 重复，请检查成员文件。');
  const questions = templates.map(t=>t.dataset.question);
  const first = q => questions.indexOf(q) + 1;
  const rail = (q,index) => `<aside class="rail"><a class="rail-brand" href="#slide-1" title="COMP5621 Homework 1">HW<br>01</a><nav class="vertical-timeline" aria-label="Question timeline">${groups.map(([n,subs])=>{
    const active=q.startsWith(n), past=Number(n)<Number(q[0]);
    return `<div class="timeline-group ${active?'current':past?'done':''}"><a class="major-tick" href="#slide-${first(subs[0])}" title="Problem ${n}"><b>${n}</b></a>${active?subs.map(sub=>`<div class="timeline-sub ${sub===q?'active':first(sub)-1<index?'done':''}"><a class="minor-tick" href="#slide-${first(sub)}" title="Problem ${n}(${sub.slice(1)})" ${sub===q?'aria-current="step"':''}>(${sub.slice(1)})</a></div>`).join(''):''}</div>`;
  }).join('')}</nav></aside>`;
  for (const [i,t] of templates.entries()) {
    const fragment=t.content.cloneNode(true), body=fragment.querySelector('.body-content');
    if (!body) throw Error(`页面 ${t.dataset.key} 缺少 body-content。`);
    body.remove();
    const header=document.createElement('div');header.append(fragment);
    const s=document.createElement('section');
    // 首页和末页的框架都在根目录；末页保留最后一道题，不增加总结口号。
    s.className='slide '+(i===0?'title-slide':i===templates.length-1?'final-slide':'');
    s.id=`slide-${i+1}`;s.dataset.key=t.dataset.key;s.dataset.owner=t.dataset.owner;
    s.innerHTML=rail(t.dataset.question,i)+`<div class="page"><header>${header.innerHTML}<span class="folio">${String(i+1).padStart(2,'0')} / ${templates.length}</span></header><div class="body">${body.outerHTML}</div><footer><span>${escapeHTML(t.dataset.owner)}</span><span>${escapeHTML(t.dataset.source||'')}</span></footer></div>`;
    document.querySelector('#deck').append(s);
  }
  document.querySelector('#loading').remove();
  initializeViewer();
  window.deckReady=true;
}
function initializeViewer() {
(()=>{const slides=[...document.querySelectorAll('.slide')];let index=0;const pos=document.getElementById('position');
// 为左右比较区域按阅读顺序生成标记。
for(const slide of slides){
 if(slide.dataset.key.startsWith('3e-'))continue;
 let n=0;
 for(const group of slide.querySelectorAll('.reading-group')){
  group.removeAttribute('data-step');
  const branches=[...group.querySelectorAll('.teaching-split > section,.capacity-working > div,.header-reading > div,.chunk-work-grid > section')];
  for(const region of branches.length?branches:[group]){
   region.classList.add('reading-target');region.dataset.readOrder=++n;
  }
 }
}
function current(){const m=location.hash.match(/^#slide-(\d+)$/);if(m)index=Math.min(slides.length-1,Math.max(0,+m[1]-1));}
function fit(){const scale=Math.min(1,(innerWidth-32)/1920);if(document.body.classList.contains('presenting')){const k=Math.min(innerWidth/1920,(innerHeight-52)/1080);slides.forEach(s=>{s.style.transform=`scale(${k})`;s.style.marginBottom='0'});document.getElementById('deck').style.height=`${1080*k}px`;}else{slides.forEach(s=>{s.style.transform=`scale(${scale})`;s.style.marginBottom=`${1080*(scale-1)}px`});document.getElementById('deck').style.height='auto';}}
function show(){current();slides.forEach((s,i)=>s.classList.toggle('current-slide',i===index));pos.textContent=`${index+1} / ${slides.length}`;fit();}
function go(n){index=Math.min(slides.length-1,Math.max(0,n));location.hash=`slide-${index+1}`;show();}
document.getElementById('next').onclick=()=>go(index+1);document.getElementById('previous').onclick=()=>go(index-1);document.getElementById('presentation').onclick=()=>{document.body.classList.toggle('presenting');show()};
const guides=document.getElementById('guides');guides.onclick=()=>{const active=document.body.classList.toggle('show-guides');guides.setAttribute('aria-pressed',String(active))};
document.getElementById('deck').addEventListener('click',e=>{const a=e.target.closest('a[href^="#slide-"]');if(a){e.preventDefault();go(Number(a.getAttribute('href').slice(7))-1)}});
addEventListener('hashchange',show);addEventListener('resize',fit);addEventListener('keydown',e=>{if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();go(index+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(index-1)}if(e.key==='Escape'){document.body.classList.remove('presenting');fit()}});show();})();

}
for (const m of members) {
  const frame=document.createElement('iframe');
  frame.hidden=true;frame.title=m.name+' 的本地页面';m.frame=frame;
  frame.src=m.folder+'/pages.html';document.body.append(frame);
}
setTimeout(()=>{
  if (!completed) document.querySelector('#loading').textContent='页面未能加载。请确认下载了完整仓库，并使用 Chrome、Edge 或 Firefox 打开首页。';
}, 15000);

</script>
</body></html>
